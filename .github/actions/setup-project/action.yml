name: Setup Project
description: Installs all project dependencies

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
    - name: Setup Node.js environment
      uses: actions/setup-node@v7.0.0
      with:
        node-version: lts/*
        cache: "npm"
        cache-dependency-path: "package-lock.json"
    - name: Install dependencies
      shell: bash
      run: npm ci
